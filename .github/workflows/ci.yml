name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\MoveReminder.sln

      - name: Build
        run: dotnet build .\MoveReminder.sln -c Release --no-restore
