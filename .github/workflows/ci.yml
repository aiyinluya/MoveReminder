name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\MoveReminder.sln

      - name: Build
        run: dotnet build .\MoveReminder.sln -c Release --no-restore

      - name: Publish smoke artifact
        if: github.event_name == 'push'
        shell: pwsh
        run: .\scripts\publish.ps1 -OutputDir .\artifacts\MoveReminder-ci

      - name: Upload CI artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: MoveReminder-ci-win-x64
          path: artifacts/MoveReminder-ci/MoveReminder.exe
          if-no-files-found: error
          retention-days: 7
