name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish Windows single-file exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: pwsh
        run: .\scripts\publish.ps1 -OutputDir .\artifacts\MoveReminder-publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoveReminder-win-x64
          path: artifacts/MoveReminder-publish/MoveReminder.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/MoveReminder-publish/MoveReminder.exe
          generate_release_notes: true
