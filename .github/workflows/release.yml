name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v1.1.26"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    name: Publish Windows single-file exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: pwsh
        run: .\scripts\publish.ps1 -OutputDir .\artifacts\MoveReminder-publish

      - name: Package release assets
        shell: pwsh
        run: |
          $releaseDir = ".\artifacts\release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item ".\artifacts\MoveReminder-publish\MoveReminder.exe" "$releaseDir\MoveReminder.exe" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoveReminder-win-x64
          path: artifacts/release/MoveReminder.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          prerelease: ${{ inputs.prerelease || false }}
          files: artifacts/release/MoveReminder.exe
          generate_release_notes: true
